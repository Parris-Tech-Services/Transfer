name: Format CI fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-fix.yml
      - podcasttodo.md
      - qa.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format files reported by CI
        run: npx prettier --write podcasttodo.md qa.mjs
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcasttodo.md qa.mjs
          git commit -m "Apply Prettier formatting"
          git push
