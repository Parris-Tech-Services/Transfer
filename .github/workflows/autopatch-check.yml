name: AutoPatch CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/**'
  push:
    branches: [repair/*]

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Check package.json validity
        run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"
      - name: Check lockfile consistency
        run: node -e "const lock=JSON.parse(require('fs').readFileSync('package-lock.json','utf-8')); console.log(Object.keys(lock.packages||{}).length + ' packages')"
